<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Road Chat Bot</title>
  <style>
    :root { --bg:#0b0f19; --panel:#111827; --panel2:#0f172a; --text:#e5e7eb; --muted:#94a3b8; --accent:#22c55e; --border:#1f2937; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif; background:linear-gradient(180deg,#060812,var(--bg)); color:var(--text); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 16px; height: 100dvh; box-sizing: border-box; display:flex; flex-direction:column; gap:12px; }
    .header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:rgba(17,24,39,.8); border:1px solid var(--border); border-radius:14px; }
    .title { font-weight:700; letter-spacing:.3px; }
    .badge { font-size:12px; color:var(--muted); }
    .chat { flex:1; overflow:auto; padding:14px; background:rgba(15,23,42,.75); border:1px solid var(--border); border-radius:14px; }
    .msg { display:flex; gap:10px; margin: 10px 0; }
    .role { width:64px; font-size:12px; color:var(--muted); padding-top:8px; }
    .bubble { max-width: 680px; padding:12px 12px; border-radius:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; border:1px solid var(--border); background:rgba(17,24,39,.9); }
    .user .bubble { background:rgba(34,197,94,.10); border-color:rgba(34,197,94,.35); }
    .assistant .bubble { background:rgba(148,163,184,.08); }
    .composer { display:flex; gap:10px; padding:12px; background:rgba(17,24,39,.85); border:1px solid var(--border); border-radius:14px; }
    textarea { flex:1; resize:none; height:46px; max-height:140px; padding:12px; border-radius:12px; border:1px solid var(--border); background:rgba(15,23,42,.9); color:var(--text); outline:none; }
    button { width:110px; border:0; border-radius:12px; background:var(--accent); color:#052e16; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .hint { font-size:12px; color:var(--muted); padding:0 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">🚗 Road Chat Bot</div>
      <div class="badge" id="status">準備OK</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="hint">※ 送信すると <code>/api/chat</code> にPOSTします</div>

    <form class="composer" id="form">
      <textarea id="input" placeholder="例：バッテリー上がりです。料金はいくら？"></textarea>
      <button id="send" type="submit">送信</button>
    </form>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");

    // 会話の続きに使うID（あなたのAPIが previous_response_id を返す想定）
    let previous_response_id = null;

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "msg " + (role === "user" ? "user" : "assistant");

      const roleEl = document.createElement("div");
      roleEl.className = "role";
      roleEl.textContent = role === "user" ? "あなた" : "BOT";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(roleEl);
      row.appendChild(bubble);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage(message) {
      statusEl.textContent = "送信中…";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, previous_response_id })
        });

        const data = await res.json();

        // 返り値が { reply: "...", previous_response_id: "..." } の想定
        addMessage("assistant", data.reply ?? "（返答が空です）");
        previous_response_id = data.previous_response_id ?? null;

        statusEl.textContent = "準備OK";
      } catch (e) {
        addMessage("assistant", "通信エラー：/api/chat に届いていない可能性があります。");
        statusEl.textContent = "エラー";
      } finally {
        sendBtn.disabled = false;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      await sendMessage(text);
    });
  </script>
</body>
</html>
